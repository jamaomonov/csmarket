name: csmarket-prod
#
# Secrets live in ``./secrets/*.env``, git-ignored, next to this file inside the
# checkout on the server. ``infra/secrets-example/`` documents every key. Memory
# limits are ceilings sized for 8 GB with no swap.
#
# IMAGE_TAG is pinned in the checkout's git-ignored ``.env`` (compose reads it
# for interpolation on every command); deploy.yml writes it on each deploy.
# Without it every command here fails instead of silently resolving a stale
# cached ``:main`` — see docs/runbooks/deploy.md.
#
# Profiles: ``backup`` is in ``ops``; ``alertmanager`` is in ``ops`` and ``alerts``.
# They need M5 inputs (R2 bucket, age key, Telegram bot) and would fail on
# placeholder secrets, so they start only once ``COMPOSE_PROFILES`` is in the same
# ``.env``: ``alerts`` runs Alertmanager alone, ``ops`` both it and the backup
# (docs/runbooks/first-deploy.md, step 9).

x-app-env: &app-env
  CSMARKET_ENVIRONMENT: prod
  CSMARKET_DEBUG: "false"
  CSMARKET_LOG_LEVEL: INFO
  CSMARKET_LOG_JSON: "true"
  # Soʻm prices use the CBU rate + 1 % (ADR-0011); the snapshots stay the CBU's own rate.
  # Set here, in git, not in secrets: it is pricing policy, and this value wins over env_file.
  CSMARKET_FX_UPLIFT_PCT: "1"
  # Waxpeer is not a buy source for now (2026-10-07): Skinslink resells the same Waxpeer
  # listings (99.7 % the same assets) at the same price or cheaper. Waxpeer still brings the
  # Steam price, checks trade links and settles orders bought there. ADR-0010.
  CSMARKET_WAXPEER_BUY_ENABLED: "false"

# Bound every container's json-file logs. Without this the driver keeps an
# unbounded log per container, which fills the disk and gets replayed on every
# promtail restart. Promtail already ships everything to Loki, so a small local
# buffer is all we need: 10 MB x 3 files = 30 MB per container at most.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Memory ceilings on every container. The box has NO swap, so memory pressure
# goes straight to the kernel OOM killer, which picks its victim by size. These
# are ceilings, not reservations: each is roughly 3-4x the expected steady state,
# so the point is to stop runaway growth, not to pack the box. Too tight and the
# container exits 137 into a restart loop (for postgres, repeated crash
# recovery) — err loose. Deliberately no cpu quotas: a hard quota caps
# throughput during exactly the spike it was provisioned for.

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    mem_limit: 2g
    # Parallel-query results go through shared memory and Docker's default
    # /dev/shm is 64 MB; larger tables then fail with "could not resize shared
    # memory segment".
    shm_size: 512m
    restart: unless-stopped
    # Sized for the 4 vCPU / 8 GB box and the 2 GB container limit above, not
    # for the host: the two must not be confused, or the OOM killer settles it.
    command:
      - postgres
      # A quarter of the container limit; the rest covers connections, work_mem
      # and maintenance.
      - "-c"
      - "shared_buffers=512MB"
      # A planner hint, not an allocation: shared_buffers plus the host page cache.
      - "-c"
      - "effective_cache_size=2GB"
      # Per sort, per connection — kept modest.
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      # SSD: the default of 4 biases the planner towards sequential scans.
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      # Pools reach api 20 + worker 20 + scheduler 20; the rest is headroom for
      # psql and migrations.
      - "-c"
      - "max_connections=100"
      # Safety net for a connection leaked inside a transaction (an upstream
      # call made while holding one), not a policy for slow work.
      - "-c"
      - "idle_in_transaction_session_timeout=600s"
      # Query-level evidence for "the database got slow".
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=top"
    env_file: ./secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container shell — POSTGRES_USER/DB come
      # from the env_file at runtime, not from compose interpolation. A bare
      # ``pg_isready`` probes as OS user root and spams the server log with
      # ``FATAL: role "root" does not exist`` every interval.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    logging: *default-logging
    mem_limit: 64m
    restart: unless-stopped
    env_file: ./secrets/postgres-exporter.env
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    logging: *default-logging
    mem_limit: 384m
    restart: unless-stopped
    # requirepass: Redis holds rate-limit counters and caches, so it must not be
    # an open door to anything that gets a foothold on the docker network. $$
    # defers expansion to the container shell; REDIS_PASSWORD comes from the
    # env file.
    env_file: ./secrets/redis.env
    # --maxmemory bounds it; the eviction policy stays `noeviction` ON PURPOSE.
    # `allkeys-lru` looks like the safe default and is the dangerous one here:
    # evicting a rate-limit counter silently weakens the limit. Refusing writes
    # is the correct failure — paired with an alert at 70% so a human steps in
    # first. mem_limit is deliberately higher than maxmemory, so Redis hits its
    # own ceiling before the OOM killer sees it.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data

  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    logging: *default-logging
    mem_limit: 64m
    restart: unless-stopped
    # Reads REDIS_PASSWORD straight from the shared redis.env.
    env_file: ./secrets/redis.env
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  api:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/csmarket-api:${IMAGE_TAG:?set IMAGE_TAG in .env (see docs/runbooks/deploy.md)}
    logging: *default-logging
    mem_limit: 1g
    # From M4b every open order WebSocket costs a descriptor (the process shares one
    # Postgres LISTEN connection for all of them, ADR-0008). The inherited default is
    # 1024 — a hard wall past which uvicorn stops accepting ANY connection, HTTP included.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    environment:
      <<: *app-env
    env_file: ./secrets/api.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # No compose-level healthcheck: the image (infra/docker/api.Dockerfile)
    # ships its own HEALTHCHECK.

  worker:
    # /metrics on :9101 (CSMARKET_WORKER_METRICS_PORT), scraped by Prometheus over the compose
    # network; deliberately not published.
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/csmarket-worker:${IMAGE_TAG:?set IMAGE_TAG in .env (see docs/runbooks/deploy.md)}
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *app-env
      # Shares api.env; its own name so Sentry tells the three processes apart.
      CSMARKET_SERVICE_NAME: csmarket-worker
    env_file: ./secrets/api.env
    depends_on: [postgres, redis]

  scheduler:
    # /metrics on :9102 (CSMARKET_SCHEDULER_METRICS_PORT): the order-health gauges. Not published.
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/csmarket-scheduler:${IMAGE_TAG:?set IMAGE_TAG in .env (see docs/runbooks/deploy.md)}
    logging: *default-logging
    # 1g: the Skinslink mirror (~435k rows) and the LIS-SKINS snapshot (~1.9M lots, streamed)
    # keep it near 440 MB after the first ticks (2026-10-07).
    mem_limit: 1g
    restart: unless-stopped
    environment:
      <<: *app-env
      CSMARKET_SERVICE_NAME: csmarket-scheduler
    env_file: ./secrets/api.env
    depends_on: [postgres, redis]

  web:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/csmarket-web:${IMAGE_TAG:?set IMAGE_TAG in .env (see docs/runbooks/deploy.md)}
    logging: *default-logging
    mem_limit: 1g
    # Same inherited 1024 default; Next.js holds sockets for SSR fetches and
    # keep-alives.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    environment:
      # Server Components and ISR revalidation talk to the API directly over
      # the compose network instead of leaving the box through Cloudflare and
      # Caddy. These calls carry no X-Forwarded-For, so the API keys them on the
      # web container's own address: ALL server rendering shares one per-IP
      # rate-limit bucket (the public hostname would collapse them into the
      # VPS's address just the same). M2 must forward the visitor IP from Next
      # or exempt the internal network (ADR-0003).
      # Not a secret: it is an internal hostname, so it belongs here rather than
      # in secrets/web.env (public-only, since NEXT_PUBLIC_* is inlined into the
      # browser bundle).
      API_INTERNAL_URL: http://api:8000
    env_file: ./secrets/web.env
    depends_on:
      api: { condition: service_started }

  admin:
    image: ghcr.io/${GHCR_OWNER:-jamaomonov}/csmarket-admin:${IMAGE_TAG:?set IMAGE_TAG in .env (see docs/runbooks/deploy.md)}
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    # admin is a static Vite build served by nginx — no env file
    # because every config is baked into the build at CI time.

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    # The stack's own edge: Caddy owns 80/443 on this box and terminates TLS
    # (Cloudflare proxies every hostname in front of it).
    ports:
      - "80:80"
      - "443:443"
    # ACME_EMAIL and GRAFANA_BASIC_AUTH_HASH, substituted into the Caddyfile.
    env_file: ./secrets/caddy.env
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # docs.csmarket.uz: a directory mount, so a deploy's checkout shows through.
      - ./infra/docs-site:/srv/docs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, admin]

  prometheus:
    image: prom/prometheus:v3.12.0
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  node-exporter:
    image: prom/node-exporter:v1.11.1
    logging: *default-logging
    mem_limit: 64m
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # M5: needs a real Telegram bot token. ``alerts`` runs it alone (the server's
    # .env sets COMPOSE_PROFILES=alerts); ``ops`` keeps meaning it and the backup.
    profiles: [ops, alerts]
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    # ALERT_BOT_TOKEN / ALERT_CHAT_ID: see infra/secrets-example/alertmanager.env.
    env_file: ./secrets/alertmanager.env
    volumes:
      - ./infra/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager-data:/alertmanager
    # Alertmanager does no env expansion of its own, so the template's two
    # placeholders are rendered here at start-up. The result goes to the
    # private volume, never to the bind mount, so the credentials stay out of
    # the repo and out of the image. `chat_id` is unquoted on purpose —
    # Alertmanager wants an integer there.
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|__ALERT_BOT_TOKEN__|$$ALERT_BOT_TOKEN|"
        -e "s|__ALERT_CHAT_ID__|$$ALERT_CHAT_ID|"
        /etc/alertmanager/alertmanager.tmpl.yml > /alertmanager/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/alertmanager/alertmanager.yml
        --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:13.0.2
    logging: *default-logging
    mem_limit: 384m
    restart: unless-stopped
    env_file: ./secrets/grafana.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.7.2
    logging: *default-logging
    mem_limit: 768m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.6.11
    logging: *default-logging
    mem_limit: 192m
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # promtail only enumerates containers through it. ``:ro`` stops writes to
      # the socket FILE, not calls to the Docker API: anyone who can open the
      # socket can still drive the daemon, which is host root. Treat this image
      # as trusted; a socket proxy limited to GET /containers would be the fix.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on: [loki]

  backup:
    image: alpine:3.20
    # M5: needs the R2 bucket and the age recipient; enabled by
    # COMPOSE_PROFILES=ops. ``make backup`` / ``make restore`` name the service
    # explicitly, which runs it regardless of the profile.
    profiles: [ops]
    logging: *default-logging
    mem_limit: 256m
    # Long-running: run_nightly.sh sleeps until BACKUP_HOUR_UTC (default 02:00)
    # and runs pg_backup.sh daily. unless-stopped keeps the schedule alive
    # across reboots. One-off runs override the command (see `make backup`).
    restart: unless-stopped
    env_file: ./secrets/backup.env
    volumes:
      - ./infra/backup:/scripts:ro
      - backup-tmp:/tmp/backup
    depends_on: [postgres]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'apk add --no-cache postgresql-client age rclone bash >/dev/null && exec "$@"',
        "--",
      ]
    command: ["/bin/sh", "/scripts/run_nightly.sh"]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  backup-tmp:
