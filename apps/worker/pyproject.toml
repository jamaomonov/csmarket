[project]
name = "csmarket-worker"
version = "0.0.1"
description = "csmarket background worker (Postgres-queue consumer)"
requires-python = ">=3.12"
dependencies = ["csmarket", "asyncpg>=0.29", "structlog>=24.4"]

[tool.uv.sources]
csmarket = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csmarket_worker"]
