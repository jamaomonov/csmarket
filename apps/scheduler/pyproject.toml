[project]
name = "csmarket-scheduler"
version = "0.0.1"
description = "csmarket periodic jobs (APScheduler)"
requires-python = ">=3.12"
dependencies = ["csmarket", "apscheduler>=3.10", "structlog>=24.4"]

[tool.uv.sources]
csmarket = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csmarket_scheduler"]
