    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>csmarket admin</title>

      Anti-FOUC: /theme.js resolves the theme synchronously before any stylesheet or
      module loads, so the first paint already has the right palette. A file, not an
      inline script: the admin's CSP allows no inline script (Caddyfile.prod).
    -->
    <script src="/theme.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
