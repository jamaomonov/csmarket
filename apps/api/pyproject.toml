[project]
name = "csmarket"
version = "0.0.1"
description = "csmarket backend — FastAPI modular monolith"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    # Direct, not transitive-by-accident: core/metrics.py imports Counter from it.
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk[fastapi]>=2.17",
    "slowapi>=0.1.9",
    "pynacl>=1.5",
    "cryptography>=43.0",
    "uuid-utils>=0.10",
    "orjson>=3.10",
    "pyjwt[crypto]>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    # A hung test once burnt a CI hour in silence; a timeout names the test.
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.15",
    "fakeredis>=2.26",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.7",
    "anyio>=4.6",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csmarket"]
