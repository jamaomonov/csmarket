groups:
  - name: p2p
    rules:
      # A HUMO message the parser could not read: nothing in it is credited. If HUMO
      # changed its format, every transfer from now on lands here (spec 2026-10-19-p2p-topup).
      - alert: P2PUnparsed
        expr: increase(csmarket_p2p_alerts_total{job="api",kind="unparsed"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "P2P: a HUMO notification could not be read"
          runbook: "https://github.com/jamaomonov/csmarket/blob/main/docs/runbooks/p2p.md#unparsed"

      # The card's balance did not follow from the previous message: a notification was
      # missed (or arrived out of order) — a transfer may be waiting unmatched.
      - alert: P2PChainBreak
        expr: increase(csmarket_p2p_alerts_total{job="api",kind="chain_break"}[10m]) > 0
        labels: { severity: warn }
        annotations:
          summary: "P2P: a gap in the card's balance chain"
          runbook: "https://github.com/jamaomonov/csmarket/blob/main/docs/runbooks/p2p.md#chain-break"

      # Two active cards end in the same four digits: no transfer to them is credited
      # automatically.
      - alert: P2PAmbiguousCard
        expr: increase(csmarket_p2p_alerts_total{job="api",kind="ambiguous_card"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "P2P: two active cards share their last four digits"
          runbook: "https://github.com/jamaomonov/csmarket/blob/main/docs/runbooks/p2p.md#ambiguous-card"

      # Buyers asked for transfers that never came, and no HUMO message at all arrived in an
      # hour: the bot, its Business connection or the relay is likely down.
      - alert: P2PSilence
        expr: >
          increase(csmarket_p2p_requests_expired_total{job="scheduler"}[1h]) > 0
          and (time() - csmarket_p2p_last_notification_timestamp_seconds{job="scheduler"}) > 3600
        labels: { severity: page }
        annotations:
          summary: "P2P: requests expire and no HUMO notification arrived for an hour"
          runbook: "https://github.com/jamaomonov/csmarket/blob/main/docs/runbooks/p2p.md#silence"
