groups:
  - name: infra
    rules:
      - alert: DiskSpaceLow
        # 20%, not 10%: a full disk wedges Loki and Postgres together, and by
        # the time 10% is left there is no room to manoeuvre.
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.20
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Root filesystem < 20% free"

      - alert: HostHighMemory
        # The host has NO swap, so there is no grace period between pressure
        # and the OOM killer — which picks its victim by size, and the largest
        # process is Postgres.
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.20
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Host memory available < 20%"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Postgres exporter not scrapeable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Redis exporter not scrapeable"

      - alert: BackupStale
        # The nightly pg_dump → age → R2 run writes this timestamp only after a successful
        # upload (infra/backup/pg_backup.sh); 26 h = one missed night plus slack.
        expr: time() - csmarket_backup_last_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "No successful database backup to R2 for over 26 hours"
          runbook: "docs/runbooks/backups.md"

      - alert: BackupNeverRan
        # No timestamp at all: the backup service is off (COMPOSE_PROFILES lacks ops), its
        # metrics volume is not mounted, or it has never succeeded since the deploy.
        expr: absent(csmarket_backup_last_success_timestamp_seconds)
        for: 27h
        labels: { severity: page }
        annotations:
          summary: "No database backup has been recorded for 27 hours"
          runbook: "docs/runbooks/backups.md"
