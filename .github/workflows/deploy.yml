name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        # One box, one environment: there is no staging server to deploy to.
        options: ["production"]
      image_tag:
        description: "Image tag (sha-..., vX.Y.Z, or main)"
        required: true
        default: "main"

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # The tag is a free-form dispatch input. Validate the shape here and
      # pass it to the remote script as an env var (never interpolate
      # ${{ }} into shell text — that is a command-injection vector).
      - name: Validate image tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG_INPUT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$'; then
            echo "::error::invalid image_tag: must match ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG_INPUT
          script: |
            set -euo pipefail
            # Everything lives in the deploy user's checkout: compose, configs,
            # and the git-ignored secrets/ it mounts by relative path. No
            # root-owned paths, so no sudo anywhere in this script.
            cd "$HOME/opt/csmarket"
            git fetch --all --tags --prune --force
            # Land the checkout on the commit the images were built from, so
            # compose, the Caddyfile and the alert rules always match the images
            # (and a rollback rolls them back too). Build images tags a commit
            # three ways: ``main`` (a branch), ``vX.Y.Z`` (the git tag itself)
            # and ``sha-<7 hex>`` (strip the prefix to get the commit). A branch
            # is hard-reset to its freshly fetched remote ref — a plain
            # ``git checkout main`` would stay on the stale local branch.
            # Anything that resolves to no commit fails the deploy: falling
            # back to some other checkout would run new images on old infra.
            ref="${IMAGE_TAG_INPUT#sha-}"
            if git rev-parse -q --verify "origin/$ref^{commit}" >/dev/null; then
              git checkout -B "$ref" "origin/$ref"
            elif git rev-parse -q --verify "$ref^{commit}" >/dev/null; then
              git checkout --detach "$ref"
            else
              echo "::error::image tag $IMAGE_TAG_INPUT names no branch, tag or commit in the checkout"
              exit 1
            fi
            export IMAGE_TAG="$IMAGE_TAG_INPUT"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

            # Pin the tag in the checkout's git-ignored .env, which compose reads
            # for interpolation on every command. docker-compose.prod.yml refuses
            # to start without IMAGE_TAG, so a later hand-run ``up -d`` reuses
            # exactly this tag instead of a stale cached ``:main``. Other lines
            # (COMPOSE_PROFILES, say) are kept. Written only after the pull and
            # the migration succeeded.
            touch .env
            { grep -v '^IMAGE_TAG=' .env || true; printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"; } > .env.new
            mv .env.new .env
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # The app stack's Caddyfile is a single-FILE bind mount, so the
            # container holds the inode it was created with. ``up -d`` above
            # only recreates services whose compose spec changed — which a
            # mounted file's contents are not — so a routing change (a new
            # site block, a header, a CSP) would deploy as a silent no-op
            # while the container kept the inode ``git checkout`` replaced.
            # Recreate caddy only when the file actually differs. A missing
            # container (first run) fails the exec and takes the recreate branch.
            APP_WANT="$(sha256sum infra/caddy/Caddyfile.prod | cut -d' ' -f1)"
            APP_HAVE="$(docker compose -f docker-compose.prod.yml exec -T caddy \
              sha256sum /etc/caddy/Caddyfile 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$APP_WANT" != "$APP_HAVE" ]; then
              echo "app Caddyfile changed ($APP_HAVE -> $APP_WANT); recreating"
              docker compose -f docker-compose.prod.yml up -d --force-recreate caddy
            fi

            # Poll the health endpoints instead of a fixed sleep: a freshly
            # recreated api can take longer than a few seconds to serve,
            # and a single early curl would 502 and false-fail an otherwise
            # good deploy. Fail only after the endpoint stays unhealthy for the
            # whole window.
            wait_ok() {
              url="$1"; tries="${2:-40}"; i=1
              while [ "$i" -le "$tries" ]; do
                if curl -fsS -o /dev/null "$url"; then
                  echo "ok: $url (attempt $i)"; return 0
                fi
                sleep 3; i=$((i + 1))
              done
              echo "::error::$url not healthy after $((tries * 3))s"
              curl -sS -o /dev/null -w "last status: %{http_code}\n" "$url" || true
              return 1
            }
            wait_ok https://api.csmarket.uz/healthz 40
            wait_ok https://api.csmarket.uz/readyz 40
            wait_ok https://csmarket.uz/ 40

            # Reclaim images this deploy replaced. Each ``pull`` of a moving tag
            # (:main) leaves the prior image dangling; over weeks of deploys that
            # accumulates untagged layers that can fill the disk and wedge
            # Loki's ingester. Dangling-only. Runs only after
            # the health checks pass, so a good rollback image is never pruned
            # out from under a failed deploy.
            docker image prune -f
            # Deploys by ``sha-<x>`` tag leave nothing dangling: every one keeps a
            # tagged image per service, so stale images pile up and fill the disk.
            # Keep the three newest per service — the running one and two to roll
            # back to; ``rmi`` refuses anything a container still uses. Only our
            # own ``ghcr.io/jamaomonov/csmarket-*`` repos, never another stack's.
            for repo in $(docker images --format '{{.Repository}}' | grep '^ghcr.io/jamaomonov/csmarket-' | sort -u); do
              docker images "$repo" --format '{{.Repository}}:{{.Tag}}' | tail -n +4 \
                | while read -r img; do docker rmi "$img" >/dev/null 2>&1 || true; done
            done
            df -h / | tail -1
