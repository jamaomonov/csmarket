name: Build images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: scheduler
            dockerfile: infra/docker/scheduler.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            # Next.js inlines NEXT_PUBLIC_* at build time — they must be passed
            # here, not (only) at runtime, for the client bundle to see them.
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=https://api.csmarket.uz
          - image: admin
            dockerfile: infra/docker/admin.Dockerfile
            # Vite inlines VITE_* at build time.
            build_args: |
              VITE_API_BASE_URL=https://api.csmarket.uz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # BuildKit from Google's Docker Hub mirror: Docker Hub rate-limits the runners (429).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/csmarket-${{ matrix.image }}
          # Every image tag must also be a git ref deploy.yml can check out:
          # ``main`` (branch), ``vX.Y.Z`` (the git tag verbatim — semver
          # patterns would drop the ``v``) and ``sha-<7 hex>`` (the commit).
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite reads VITE_* at build time and inlines into the JS
          # bundle. Empty for api / worker / scheduler —
          # they read env at runtime and don't need build args.
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
