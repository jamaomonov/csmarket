name: Build images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: scheduler
            dockerfile: infra/docker/scheduler.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            # Next.js inlines NEXT_PUBLIC_* at build time — they must be passed
            # here, not (only) at runtime, for the client bundle to see them.
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=https://api.csmarket.uz
          - image: admin
            dockerfile: infra/docker/admin.Dockerfile
            # Vite inlines VITE_* at build time.
            build_args: |
              VITE_API_BASE_URL=https://api.csmarket.uz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit from Google's Docker Hub mirror: Docker Hub rate-limits the runners (429).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/csmarket-${{ matrix.image }}
          # Every image tag must also be a git ref deploy.yml can check out:
          # ``main`` (branch), ``vX.Y.Z`` (the git tag verbatim — semver
          # patterns would drop the ``v``) and ``sha-<7 hex>`` (the commit).
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite reads VITE_* at build time and inlines into the JS
          # bundle. Empty for api / worker / scheduler —
          # they read env at runtime and don't need build args.
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
